<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 진행 상황</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #f4f5f7; color: #1c1e21; -webkit-text-size-adjust: 100%; }
header { background: #fff; padding: 16px 20px 12px; border-bottom: 1px solid #e4e6eb; position: sticky; top: 0; z-index: 20; }
header h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
header .status { font-size: 12px; color: #8a8d91; margin-top: 4px; }
header .links { margin-top: 10px; }
header .links a { display: inline-block; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 20px; background: #e7f3ff; color: #1877f2; text-decoration: none; }
main { max-width: 680px; margin: 0 auto; padding: 12px 12px 48px; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.card h2 .count { color: #1877f2; }
.notice { font-size: 13px; line-height: 1.75; color: #65676b; }
.products { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.product { flex: 0 0 150px; border: 2px solid #e4e6eb; border-radius: 12px; padding: 10px; cursor: pointer; text-align: center; background: #fff; transition: border-color .15s; }
.product.sel { border-color: #1877f2; }
.product img { width: 100%; height: 96px; object-fit: contain; }
.product .plabel { font-size: 11px; font-weight: 700; color: #1877f2; margin-top: 6px; }
.product .pname { font-size: 12px; font-weight: 600; margin-top: 2px; line-height: 1.4; min-height: 34px; }
.product .pprice { font-size: 12px; color: #65676b; margin-top: 4px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; }
.chip { flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 8px 14px; border: 1px solid #ccd0d5; border-radius: 20px; background: #fff; cursor: pointer; color: #1c1e21; }
.chip.on { background: #1877f2; color: #fff; border-color: #1877f2; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search { flex: 1; min-width: 140px; display: flex; align-items: center; background: #f0f2f5; border-radius: 20px; padding: 8px 14px; }
.search input { flex: 1; border: none; background: none; font-size: 13px; outline: none; color: inherit; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #65676b; white-space: nowrap; }
.store { border: 1px solid #e4e6eb; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.store .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.store .name { font-size: 14px; font-weight: 700; }
.store .addr { font-size: 12px; color: #65676b; margin-top: 2px; }
.store .qty { font-size: 20px; font-weight: 800; color: #1877f2; white-space: nowrap; }
.store .qty small { font-size: 12px; font-weight: 600; color: #65676b; }
.store .meta { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 12px; }
.badge.ok { background: #e7f3ff; color: #1877f2; }
.badge.no { background: #f0f2f5; color: #8a8d91; }
.badge.region { background: #f0f2f5; color: #65676b; }
.store .time { font-size: 11px; color: #8a8d91; }
.store .actions { margin-top: 8px; display: flex; gap: 8px; }
.store .actions a { font-size: 12px; font-weight: 600; color: #1877f2; text-decoration: none; }
#map { height: 380px; border-radius: 14px; margin: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); z-index: 1; }
.map-legend { display: flex; gap: 12px; font-size: 12px; color: #65676b; padding: 0 16px 8px; flex-wrap: wrap; }
.map-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.pin { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.pin.blue { background: #1877f2; }
.pin.purple { background: #8e24aa; }
.pin.gray { background: #9e9e9e; }
.ev { font-size: 13px; padding: 10px 0; border-bottom: 1px solid #f0f2f5; line-height: 1.6; }
.ev:last-child { border-bottom: none; }
.ev .t { color: #8a8d91; font-size: 12px; }
.ev .up { color: #e41e3f; font-weight: 800; }
.ev .down { color: #1877f2; font-weight: 800; }
.ev .new { display: inline-block; font-size: 10px; font-weight: 800; background: #e41e3f; color: #fff; border-radius: 8px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; }
.sitefoot { font-size: 12px; color: #8a8d91; line-height: 1.8; padding: 4px 8px; }
.empty { padding: 36px 0; text-align: center; color: #8a8d91; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="status" id="status">불러오는 중…</div>
  <div class="links"><a href="https://t.me/pokeca_stock_bot" target="_blank" rel="noopener">🔔 텔레그램 알림 받기</a></div>
</header>
<main>
  <div id="map"></div>
  <div class="map-legend">
    <span><span class="dot" style="background:#8e24aa"></span>2시간 이내 입고</span>
    <span><span class="dot" style="background:#1877f2"></span>일반</span>
    <span><span class="dot" style="background:#9e9e9e"></span>5시간 이상 경과</span>
  </div>
  <section class="card notice">
    개인용 재고 조회 사이트입니다. 10분마다 편의점 재고를 수집합니다.<br>
    재고는 실제와 다를 수 있으니 매장에 직접 확인 후 방문하세요.
  </section>

  <section class="card">
    <h2>조회 중인 상품</h2>
    <div class="products" id="products"></div>
  </section>

  <section class="card">
    <h2 id="stockTitle">재고 있는 매장</h2>
    <div class="chips" id="regions"></div>
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="매장명 검색" autocomplete="off"></div>
      <label class="toggle"><input type="checkbox" id="pickupOnly"> 픽업 가능만</label>
    </div>
    <div id="stock"></div>
  </section>

  <section class="card">
    <h2>최근 변동</h2>
    <div id="events"></div>
  </section>

  <div class="sitefoot">
    편의점 재고 정보를 모아 보여주는 개인 사이트입니다.<br>
    재고는 실제와 다를 수 있으며 구매를 보장하지 않습니다.<br>
    편의점 각 사·포켓몬과 무관하며, 이미지 권리는 각 사에 있습니다.
  </div>
</main>
<script>
let ST = null, STORES = [], EVENTS = [];
let sel = null, region = "all", pickupOnly = false, query = "";
let map = null, layer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "방금 전";
  if (m < 60) return m + "분 전";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "시간 전";
  return Math.floor(h / 24) + "일 전";
}
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) { return null; }
}

// 지역 순서: 전국, 서울, 경기, 나머지
function orderedRegions() {
  const names = (ST.regions || []).map(r => r.name);
  const rest = names.filter(n => n !== "서울" && n !== "경기");
  return ["all", "서울", "경기", ...rest];
}
const regionLabel = r => r === "all" ? "전국" : r;

async function api(path) {
  let p;
  if (path === "/status") p = "/status.json";
  else if (path.startsWith("/events")) p = "/events.json";
  else if (path.startsWith("/stock?")) {
    const q = new URLSearchParams(path.slice(7));
    p = "/stock-" + q.get("provider") + "-" + q.get("product_id") + ".json";
  } else throw new Error("unknown path");
  const r = await fetch("./data" + p);
  if (!r.ok) throw new Error("api failed");
  return r.json();
}

async function loadStatus() {
  ST = await api("/status");
  const upd = ST.updated || {};
  $("status").textContent = Object.entries(upd).map(([k, v]) => k + " " + ago(v)).join(" · ") || "데이터 없음";
  if (!sel || !(ST.products || []).some(p => p.provider === sel.provider && p.id === sel.id)) {
    const saved = ls("sel");
    sel = null;
    if (saved) {
      try {
        const s = JSON.parse(saved);
        sel = (ST.products || []).find(p => p.provider === s.provider && p.id === s.id) || null;
      } catch (e) {}
    }
    sel = sel || (ST.products || [])[0] || null;
  }
  renderProducts();
  renderRegions();
}

function renderProducts() {
  const el = $("products");
  el.innerHTML = (ST.products || []).map(p => `
    <div class="product ${sel && sel.provider === p.provider && sel.id === p.id ? "sel" : ""}"
         data-p="${esc(p.provider)}" data-id="${esc(p.id)}">
      <div class="plabel">${esc(p.provider_label || "")}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="pprice">${p.price ? p.price.toLocaleString() + "원" : ""} · ${p.stores_in_stock ?? 0}곳</div>
    </div>`).join("");
  el.querySelectorAll(".product").forEach(d => d.onclick = () => {
    sel = (ST.products || []).find(p => p.provider === d.dataset.p && p.id === d.dataset.id);
    ls("sel", JSON.stringify({provider: sel.provider, id: sel.id}));
    renderProducts(); loadStock();
  });
}

function renderRegions() {
  const regs = orderedRegions();
  const saved = ls("region");
  region = regs.includes(saved) ? saved : "all";
  pickupOnly = ls("pickupOnly") === "1";
  query = ls("q") || "";
  $("pickupOnly").checked = pickupOnly;
  $("q").value = query;
  $("regions").innerHTML = regs.map(r =>
    `<button class="chip ${r === region ? "on" : ""}" data-r="${esc(r)}">${esc(regionLabel(r))}</button>`
  ).join("");
  document.querySelectorAll("#regions .chip").forEach(c => c.onclick = () => {
    region = c.dataset.r; ls("region", region); renderRegions(); renderStock();
  });
}

async function loadStock() {
  if (!sel) { $("stock").innerHTML = ""; if (layer) layer.clearLayers(); return; }
  STORES = await api(`/stock?provider=${encodeURIComponent(sel.provider)}&product_id=${encodeURIComponent(sel.id)}`);
  const pl = (ST.providers || []).find(p => p.key === sel.provider);
  const n = STORES.filter(s => (s.qty || 0) > 0).length;
  $("stockTitle").innerHTML = `재고 있는 매장 <span class="count">${pl ? esc(pl.label) : ""} ${n}곳</span>`;
  renderStock();
}

function pinColor(s) {
  const now = Date.now() / 1000;
  if (s.restocked_at && (now - s.restocked_at) <= 2 * 3600) return "purple";  // 2시간 이내 입고
  if (s.changed_at && (now - s.changed_at) > 5 * 3600) return "gray";        // 5시간 경과
  return "blue";                                                             // 일반
}

function restockText(ts) {
  if (!ts) return "";
  const now = Date.now() / 1000;
  const h = Math.floor((now - ts) / 3600);
  const d = new Date(ts * 1000);
  const md = (d.getMonth() + 1) + "/" + d.getDate() + " " +
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  if (h < 1) return "입고 " + md + " (1시간 이내)";
  if (h < 24) return "입고 " + md + " (" + h + "시간 경과)";
  return "입고 " + md + " (" + Math.floor(h / 24) + "일 경과)";
}

function renderStock() {
  let list = STORES.filter(s => (s.qty || 0) > 0);
  // 지도는 필터 무시하고 재고 있는 전 매장 표시
  const mapList = list.slice().sort((a, b) => (b.qty || 0) - (a.qty || 0));
  if (region !== "all") list = list.filter(s => (s.regions || []).includes(region));
  if (pickupOnly) list = list.filter(s => s.pickup);
  if (query) list = list.filter(s => (s.name || "").includes(query));
  list.sort((a, b) => (b.qty || 0) - (a.qty || 0));

  $("stock").innerHTML = list.length ? list.map(s => `
    <div class="store">
      <div class="top">
        <div><div class="name">${esc(s.name)}</div><div class="addr">${esc(s.addr || "")}</div></div>
        <div class="qty">${s.qty ?? 0}<small>개</small></div>
      </div>
      <div class="meta">
        ${s.brand ? `<span class="badge region" style="font-weight:800">${esc(s.brand)}</span>` : ""}
        <span class="badge ${s.pickup ? "ok" : "no"}">${s.pickup ? "픽업가능" : "픽업불가"}</span>
        ${(s.regions || []).map(r => `<span class="badge region">${esc(r)}</span>`).join("")}
        <span class="time">${s.changed_at ? ago(s.changed_at) + " 변동" : ""}</span>
        ${s.restocked_at ? `<span class="time" style="color:#8e24aa;font-weight:700">${esc(restockText(s.restocked_at))}</span>` : ""}
      </div>
      <div class="actions">
        <a href="https://map.naver.com/v5/search/${encodeURIComponent(s.name)}" target="_blank" rel="noopener">네이버지도</a>
        ${s.app && s.app.android ? `<a href="${esc(s.app.android)}">앱에서 보기</a>` : ""}
      </div>
    </div>`).join("")
    : `<div class="empty">재고 있는 매장이 없습니다.</div>`;

  if (layer) layer.clearLayers();
  const bounds = [];
  for (const s of mapList) {
    if (!s.lat || !s.lng) continue;
    const c = pinColor(s);
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin ${c}"></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 22],
      popupAnchor: [0, -20]
    });
    L.marker([s.lat, s.lng], {icon}).addTo(layer)
      .bindPopup(`<b>[${esc(s.brand || "")}] ${esc(s.name)}</b><br>${s.qty ?? 0}개${s.pickup ? " · 픽업가능" : ""}`);
    bounds.push([s.lat, s.lng]);
  }
  if (bounds.length && map) map.fitBounds(bounds, {padding: [30, 30]});
}

async function loadEvents() {
  EVENTS = await api("/events?limit=80");
  $("events").innerHTML = EVENTS.length ? EVENTS.map(e => {
    const up = (e.new_qty || 0) > (e.old_qty || 0);
    const isNew = (e.old_qty || 0) === 0 && (e.new_qty || 0) > 0;
    return `<div class="ev">
      <span class="t">${ago(e.ts)}</span> · ${esc(e.store_name || "")}
      ${isNew ? '<span class="new">신규입고</span>' : ""}<br>
      ${esc(e.product_name || "")} ·
      ${e.old_qty ?? "-"}개 → <span class="${up ? "up" : "down"}">${e.new_qty ?? "-"}개</span>
    </div>`;
  }).join("") : `<div class="empty">변동 내역이 없습니다.</div>`;
}

function initMap() {
  map = L.map("map").setView([36.2, 127.8], 7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19}).addTo(map);
  layer = L.layerGroup().addTo(map);
}

async function refresh() {
  try {
    await loadStatus();
    await loadEvents();
    await loadStock();
  } catch (e) {
    $("status").textContent = "불러오기 실패";
  }
}

$("pickupOnly").onchange = e => {
  pickupOnly = e.target.checked;
  ls("pickupOnly", pickupOnly ? "1" : "0");
  renderStock();
};
let qTimer = null;
$("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    query = e.target.value.trim();
    ls("q", query);
    renderStock();
  }, 200);
});

initMap();
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
